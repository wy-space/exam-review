<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的考試複習入口</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1d2421;--muted:#6b746f;--line:#e3e6e2;--acc:#0f766e;--acc2:#ccebe6;--red:#fde2e1;--redt:#b42318;--green:#dcf2e3;--greent:#1f7a3f;--yel:#fdf1cf;--yelt:#8a5a00;--org:#fde8d4;--orgt:#a2470c}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1d2220;--ink:#e8ece9;--muted:#9aa49f;--line:#2e3532;--acc:#5ec4b6;--acc2:#1f3b37;--red:#4a2321;--redt:#ffb4ab;--green:#1f3a29;--greent:#9fe0b4;--yel:#3d331a;--yelt:#f2d27a;--org:#43301f;--orgt:#ffc28f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:860px;margin:auto;padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0}#count{color:var(--acc);font-weight:700;font-size:14px}
nav{max-width:860px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:4px 12px 8px}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:14px}
nav a.on{background:var(--acc2);color:var(--acc);font-weight:700}
.badge{background:var(--redt);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}.badge:empty{display:none}
main{max-width:860px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}.card h3{font-size:16px;margin:6px 0}h3.sub{margin-top:18px}
ul{padding-left:20px;margin:6px 0}li{margin:3px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--line);margin-right:4px}
.tag.teal{background:var(--acc2);color:var(--acc)}.tag.orange{background:var(--org);color:var(--orgt)}
.tag.red{background:var(--red);color:var(--redt)}.tag.green{background:var(--green);color:var(--greent)}.tag.yellow{background:var(--yel);color:var(--yelt)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.sm{font-size:13px;padding:4px 10px}.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}.btn:disabled{opacity:.4}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dayinfo{text-align:center;font-size:14px}.dayinfo input{font:inherit;font-size:16px;font-weight:700;border:none;background:none;color:var(--ink);text-align:center}
.notice{background:var(--yel);color:var(--yelt);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.summary{background:var(--acc2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.essay{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}.essay:first-of-type{border-top:none;margin-top:0;padding-top:0}
.card>.essay:first-child{border:none;padding:0;margin:0}
.eq{font-weight:500;margin:4px 0 8px}.ans{background:var(--bg);border-radius:10px;padding:10px 14px;margin-top:8px}
.ans ul{list-style:none;padding:0}.ans li{padding:3px 0;border-bottom:1px solid var(--line)}.ans li:last-child{border:none}
.tip{color:var(--acc);font-weight:700;margin:8px 0 0}
.rate{margin-top:10px;font-size:13px;color:var(--muted)}.rate .btn{margin-left:4px}
.timer{display:flex;align-items:center;gap:10px;margin:6px 0}.tval{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc)}
.q{border-top:1px solid var(--line);padding:12px 0}.q:first-child{border:none;padding-top:0}
.qsrc{font-size:12px;color:var(--muted)}.qt{font-weight:500;margin:4px 0 8px}
.opts{display:grid;gap:6px}.opt{text-align:left;font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.right{background:var(--green);color:var(--greent);border-color:var(--greent)}.opt.bad{background:var(--red);color:var(--redt);border-color:var(--redt)}
.exp{margin-top:8px;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 12px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px}
.vc{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 8px;cursor:pointer;min-height:56px}
.vc .zh{display:none;color:var(--acc)}.vc.show .en{display:none}.vc.show .zh{display:inline}.vc .en{font-weight:700}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],#vsearch,textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--card);color:var(--ink);max-width:100%}
#vsearch{width:100%;margin-bottom:10px}textarea{width:100%;font-size:12px}
.vt{width:100%;border-collapse:collapse}.vt td{padding:6px 4px;border-bottom:1px solid var(--line)}.vt td:first-child{font-weight:700;width:45%}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.stats div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px;color:var(--acc)}.stats span{font-size:12px;color:var(--muted)}
.donebar{text-align:center;padding:14px;font-weight:700}.donebar input{transform:scale(1.3);margin-right:6px}
.notes h3{margin-top:0}a{color:var(--acc)}
.back{font-size:13px;text-decoration:none;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card.teal{border-top:4px solid var(--acc)}.card.purple{border-top:4px solid #8b5cf6}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.mini b{color:var(--ink);font-size:16px}
.go{display:inline-block;margin-top:6px;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px;padding:8px 14px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
nav a{cursor:pointer}</style></head><body><script>// ===== 共用練習紀錄（入口網站與各系統共用同一份，存在這個網域的瀏覽器裡）=====
const EXAMS = { cht: "中華電信 業務類（企管）" };   // 新增考試時在這裡加名稱
const LOGKEY = "examhub_log";
const Log = {
  all() { try { return JSON.parse(localStorage.getItem(LOGKEY) || "[]"); } catch (e) { return []; } },
  add(entry) {
    try { const a = Log.all(); a.push(Object.assign({ t: Date.now() }, entry));
      if (a.length > 8000) a.splice(0, a.length - 8000);
      localStorage.setItem(LOGKEY, JSON.stringify(a)); } catch (e) {}
  },
  replace(arr) { try { localStorage.setItem(LOGKEY, JSON.stringify(arr || [])); } catch (e) {} }
};
const _d = t => new Date(t + 8 * 3600e3).toISOString().slice(0, 10);
const _tm = t => new Date(t + 8 * 3600e3).toISOString().slice(11, 16);
const _esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 統計：連續天數、總題數、正確率
function logStats(exam) {
  const L = Log.all().filter(x => !exam || x.ex === exam);
  const q = L.filter(x => x.ty === "q"), ok = q.filter(x => x.ok).length;
  const days = [...new Set(L.map(x => _d(x.t)))].sort();
  let streak = 0, cur = _d(Date.now());
  const set = new Set(days);
  if (!set.has(cur)) cur = _d(Date.now() - 864e5);
  while (set.has(cur)) { streak++; cur = _d(Date.parse(cur + "T12:00:00+08:00") - 864e5); }
  return { total: q.length, ok, rate: q.length ? Math.round(ok / q.length * 100) : 0, days: days.length, last: days[days.length - 1] || null,
    essays: L.filter(x => x.ty === "e").length, streak };
}

// 畫出紀錄頁：opts.exam 限定某考試；opts.onRedo(keys) 提供重做按鈕
function renderHistory(root, opts = {}) {
  const st = renderHistory.st || (renderHistory.st = { ex: opts.exam || "", only: "all", day: null });
  if (opts.exam) st.ex = opts.exam;
  const L = Log.all().filter(x => !st.ex || x.ex === st.ex);
  const byDay = {};
  L.forEach(x => (byDay[_d(x.t)] = byDay[_d(x.t)] || []).push(x));
  const days = Object.keys(byDay).sort().reverse();
  if (!st.day || !byDay[st.day]) st.day = days[0] || null;
  const s = logStats(st.ex);
  let h = `<div class="hstats"><div><b>${s.days}</b><span>練習天數</span></div><div><b>${s.streak}</b><span>連續天數</span></div>
    <div><b>${s.total}</b><span>累計作答</span></div><div><b>${s.rate}%</b><span>整體正確率</span></div><div><b>${s.essays}</b><span>申論自評次數</span></div></div>`;
  h += `<div class="htool">${opts.exam ? "" : `<select id="hex"><option value="">全部考試</option>${Object.entries(EXAMS).map(([k, v]) => `<option value="${k}" ${st.ex === k ? "selected" : ""}>${_esc(v)}</option>`).join("")}</select>`}
    <select id="honly"><option value="all">全部紀錄</option><option value="bad" ${st.only === "bad" ? "selected" : ""}>只看答錯</option><option value="e" ${st.only === "e" ? "selected" : ""}>只看申論</option></select></div>`;
  if (!days.length) return root.innerHTML = h + `<p class="hmuted">還沒有練習紀錄。做題或在申論按「熟了／模糊／忘了」之後，就會記在這裡。</p>`;
  // 日曆列
  h += `<div class="hdays">${days.map(d => { const q = byDay[d].filter(x => x.ty === "q"), ok = q.filter(x => x.ok).length;
    return `<button class="hday ${d === st.day ? "on" : ""}" data-d="${d}"><b>${d.slice(5).replace("-", "/")}</b><span>${q.length} 題${q.length ? "・" + Math.round(ok / q.length * 100) + "%" : ""}</span></button>`; }).join("")}</div>`;
  let items = byDay[st.day].slice().reverse();
  if (st.only === "bad") items = items.filter(x => x.ty === "q" && !x.ok);
  if (st.only === "e") items = items.filter(x => x.ty === "e");
  const q = byDay[st.day].filter(x => x.ty === "q");
  const badKeys = [...new Set(q.filter(x => !x.ok).map(x => x.k))];
  h += `<div class="hhead"><b>${st.day}</b>　作答 ${q.length} 題，答對 ${q.filter(x => x.ok).length} 題
    ${opts.onRedo && badKeys.length ? `<button class="hbtn" id="hredo">重做這天答錯的 ${badKeys.length} 題</button>` : ""}</div>`;
  h += `<div class="hlist">${items.map(x => {
    const ex = !opts.exam && EXAMS[x.ex] ? `<span class="htag">${_esc(EXAMS[x.ex])}</span>` : "";
    if (x.ty === "q") return `<div class="hitem ${x.ok ? "ok" : "bad"}"><div class="hmeta">${_tm(x.t)} ${ex}<span class="htag">${_esc(x.src)}</span>${x.ok ? "✅" : "❌"}</div>
      <div>${_esc(x.q)}</div><div class="hans">你的答案：${_esc(x.a)}${x.ok ? "" : `　｜　正解：${_esc(x.c)}`}</div></div>`;
    if (x.ty === "e") return `<div class="hitem"><div class="hmeta">${_tm(x.t)} ${ex}<span class="htag">申論</span></div>${_esc(x.title)}　→　<b>${["忘了", "模糊", "熟了"][x.r]}</b></div>`;
    if (x.ty === "d") return `<div class="hitem"><div class="hmeta">${_tm(x.t)} ${ex}</div>✔ 完成 ${_esc(x.d)} 的進度</div>`;
    return "";
  }).join("") || `<p class="hmuted">這個篩選條件下沒有紀錄。</p>`}</div>`;
  root.innerHTML = h;
  root.querySelectorAll(".hday").forEach(b => b.onclick = () => { st.day = b.dataset.d; renderHistory(root, opts); });
  const hx = root.querySelector("#hex"); if (hx) hx.onchange = e => { st.ex = e.target.value; st.day = null; renderHistory(root, opts); };
  root.querySelector("#honly").onchange = e => { st.only = e.target.value; renderHistory(root, opts); };
  const rd = root.querySelector("#hredo"); if (rd) rd.onclick = () => opts.onRedo(badKeys);
}
const HISTORY_CSS = `
.hstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.hstats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.hstats b{display:block;font-size:22px;color:var(--acc)}.hstats span{font-size:12px;color:var(--muted)}
.htool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.htool select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);color:var(--ink)}
.hdays{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.hday{flex:none;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:center}
.hday b{display:block;font-size:14px}.hday span{font-size:11px;color:var(--muted)}.hday.on{border-color:var(--acc);background:var(--acc2)}
.hhead{margin:6px 0 10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hbtn{font:inherit;font-size:13px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:4px 10px;cursor:pointer}
.hitem{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:var(--card);font-size:14px}
.hitem.ok{border-left-color:var(--greent)}.hitem.bad{border-left-color:var(--redt)}
.hmeta{font-size:12px;color:var(--muted);margin-bottom:2px}.htag{display:inline-block;background:var(--line);border-radius:999px;padding:0 8px;margin:0 4px;font-size:11px}
.hans{font-size:13px;color:var(--muted);margin-top:2px}.hmuted{color:var(--muted)}`;
</script><header><div class="top"><h1>📚 我的考試複習入口</h1><span id="today"></span></div>
<nav><a href="#home" data-v="home">首頁</a><a href="#history" data-v="history">練習紀錄</a><a href="#backup" data-v="backup">備份</a></nav></header>
<main id="main"></main>
<script>
// 新增考試：在這裡加一筆，並把該系統資料夾放到網站裡（例如 econ/index.html），再到 history.js 的 EXAMS 加名稱
const EXAM_LIST = [
  { id: "cht", name: "中華電信 業務類（企管）", desc: "申論 40 題、企管與行銷重點、選擇題、英文與邏輯", url: "cht/", exam: "預估 2027/3 中旬筆試", color: "teal" },
  { id: "econ", name: "經濟學", desc: "週六刷題用，內容準備中", url: "", exam: "", color: "purple" }
];
const $ = s => document.querySelector(s);
function home() {
  return `<p class="muted small">每個考試是一個獨立的複習系統，練習紀錄會集中記在這裡。</p><div class="grid">` + EXAM_LIST.map(e => {
    const s = logStats(e.id);
    const body = e.url ? `<div class="mini"><span>練習 <b>${s.days}</b> 天</span><span>作答 <b>${s.total}</b> 題</span><span>正確率 <b>${s.rate}%</b></span></div>
      <p class="small muted">${s.last ? "上次練習：" + s.last : "還沒開始練習"}${e.exam ? "・" + _esc(e.exam) : ""}</p>
      <a class="go" href="${e.url}">進入複習 →</a>` : `<p class="small muted">準備中</p>`;
    return `<section class="card ${e.color}"><h2>${_esc(e.name)}</h2><p class="small">${_esc(e.desc)}</p>${body}</section>`;
  }).join("") + `</div>`;
}
function backup() {
  const all = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^(cht_|examhub_|econ_)/.test(k)) all[k] = localStorage.getItem(k); } } catch (e) {}
  return `<section class="card"><h2>💾 備份與換裝置</h2><p class="small">所有考試的進度、錯題本和練習紀錄都存在這台裝置的瀏覽器。換手機或電腦時，在這裡複製備份碼，到另一台打開同一個網址貼上並還原。</p>
    <textarea id="bk" rows="6">${_esc(JSON.stringify(all))}</textarea>
    <div class="row"><button class="btn" id="cp">複製備份碼</button><button class="btn" id="ld">還原貼上的備份碼</button><span id="msg" class="small"></span></div></section>`;
}
function render() {
  const v = ["home", "history", "backup"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  const m = $("#main");
  if (v === "home") m.innerHTML = home();
  if (v === "backup") m.innerHTML = backup();
  if (v === "history") { m.innerHTML = `<section class="card"><h2>📈 練習紀錄</h2><div id="hist"></div></section>`; renderHistory($("#hist")); }
  const cp = $("#cp"); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText($("#bk").value); $("#msg").textContent = "已複製"; } catch (e) { $("#bk").select(); $("#msg").textContent = "請手動全選複製"; } };
  const ld = $("#ld"); if (ld) ld.onclick = () => { try { const o = JSON.parse($("#bk").value); Object.entries(o).forEach(([k, val]) => localStorage.setItem(k, val)); $("#msg").textContent = "已還原"; } catch (e) { $("#msg").textContent = "備份碼格式不對"; } };
}
$("#today").textContent = new Date().toLocaleDateString("zh-TW", { timeZone: "Asia/Taipei", month: "long", day: "numeric", weekday: "short" });
addEventListener("hashchange", render); render();
</script>
</body></html>
