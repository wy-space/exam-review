*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}

<header><div class="top"><h1>中華電信 業務類（企管）複習系統</h1><span><a id="portal" class="back" hidden>← 入口網頁</a> <span id="count"></span></span></div><nav id="nav"></nav></header>
<main id="main"></main><script>const PORTAL_URL = 'index.html';
// ===== 共用練習紀錄（入口網站與各系統共用同一份，存在這個網域的瀏覽器裡）=====
const EXAMS = { cht: "中華電信 業務類（企管）" };   // 新增考試時在這裡加名稱
const LOGKEY = "examhub_log";
const Log = {
  all() { try { return JSON.parse(localStorage.getItem(LOGKEY) || "[]"); } catch (e) { return []; } },
  add(entry) {
    try { const a = Log.all(); a.push(Object.assign({ t: Date.now() }, entry));
      if (a.length > 8000) a.splice(0, a.length - 8000);
      localStorage.setItem(LOGKEY, JSON.stringify(a)); } catch (e) {}
  },
  replace(arr) { try { localStorage.setItem(LOGKEY, JSON.stringify(arr || [])); } catch (e) {} }
};
const _d = t => new Date(t + 8 * 3600e3).toISOString().slice(0, 10);
const _tm = t => new Date(t + 8 * 3600e3).toISOString().slice(11, 16);
const _esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 統計：連續天數、總題數、正確率
function logStats(exam) {
  const L = Log.all().filter(x => !exam || x.ex === exam);
  const q = L.filter(x => x.ty === "q"), ok = q.filter(x => x.ok).length;
  const days = [...new Set(L.map(x => _d(x.t)))].sort();
  let streak = 0, cur = _d(Date.now());
  const set = new Set(days);
  if (!set.has(cur)) cur = _d(Date.now() - 864e5);
  while (set.has(cur)) { streak++; cur = _d(Date.parse(cur + "T12:00:00+08:00") - 864e5); }
  return { total: q.length, ok, rate: q.length ? Math.round(ok / q.length * 100) : 0, days: days.length, last: days[days.length - 1] || null,
    essays: L.filter(x => x.ty === "e").length, streak };
}

// 畫出紀錄頁：opts.exam 限定某考試；opts.onRedo(keys) 提供重做按鈕
function renderHistory(root, opts = {}) {
  const st = renderHistory.st || (renderHistory.st = { ex: opts.exam || "", only: "all", day: null });
  if (opts.exam) st.ex = opts.exam;
  const L = Log.all().filter(x => !st.ex || x.ex === st.ex);
  const byDay = {};
  L.forEach(x => (byDay[_d(x.t)] = byDay[_d(x.t)] || []).push(x));
  const days = Object.keys(byDay).sort().reverse();
  if (!st.day || !byDay[st.day]) st.day = days[0] || null;
  const s = logStats(st.ex);
  let h = `<div class="hstats"><div><b>${s.days}</b><span>練習天數</span></div><div><b>${s.streak}</b><span>連續天數</span></div>
    <div><b>${s.total}</b><span>累計作答</span></div><div><b>${s.rate}%</b><span>整體正確率</span></div><div><b>${s.essays}</b><span>申論自評次數</span></div></div>`;
  h += `<div class="htool">${opts.exam ? "" : `<select id="hex"><option value="">全部考試</option>${Object.entries(EXAMS).map(([k, v]) => `<option value="${k}" ${st.ex === k ? "selected" : ""}>${_esc(v)}</option>`).join("")}</select>`}
    <select id="honly"><option value="all">全部紀錄</option><option value="bad" ${st.only === "bad" ? "selected" : ""}>只看答錯</option><option value="e" ${st.only === "e" ? "selected" : ""}>只看申論</option></select></div>`;
  if (!days.length) return root.innerHTML = h + `<p class="hmuted">還沒有練習紀錄。做題或在申論按「熟了／模糊／忘了」之後，就會記在這裡。</p>`;
  // 日曆列
  h += `<div class="hdays">${days.map(d => { const q = byDay[d].filter(x => x.ty === "q"), ok = q.filter(x => x.ok).length;
    return `<button class="hday ${d === st.day ? "on" : ""}" data-d="${d}"><b>${d.slice(5).replace("-", "/")}</b><span>${q.length} 題${q.length ? "・" + Math.round(ok / q.length * 100) + "%" : ""}</span></button>`; }).join("")}</div>`;
  let items = byDay[st.day].slice().reverse();
  if (st.only === "bad") items = items.filter(x => x.ty === "q" && !x.ok);
  if (st.only === "e") items = items.filter(x => x.ty === "e");
  const q = byDay[st.day].filter(x => x.ty === "q");
  const badKeys = [...new Set(q.filter(x => !x.ok).map(x => x.k))];
  h += `<div class="hhead"><b>${st.day}</b>　作答 ${q.length} 題，答對 ${q.filter(x => x.ok).length} 題
    ${opts.onRedo && badKeys.length ? `<button class="hbtn" id="hredo">重做這天答錯的 ${badKeys.length} 題</button>` : ""}</div>`;
  h += `<div class="hlist">${items.map(x => {
    const ex = !opts.exam && EXAMS[x.ex] ? `<span class="htag">${_esc(EXAMS[x.ex])}</span>` : "";
    if (x.ty === "q") return `<div class="hitem ${x.ok ? "ok" : "bad"}"><div class="hmeta">${_tm(x.t)} ${ex}<span class="htag">${_esc(x.src)}</span>${x.ok ? "✅" : "❌"}</div>
      <div>${_esc(x.q)}</div><div class="hans">你的答案：${_esc(x.a)}${x.ok ? "" : `　｜　正解：${_esc(x.c)}`}</div></div>`;
    if (x.ty === "e") return `<div class="hitem"><div class="hmeta">${_tm(x.t)} ${ex}<span class="htag">申論</span></div>${_esc(x.title)}　→　<b>${["忘了", "模糊", "熟了"][x.r]}</b></div>`;
    if (x.ty === "d") return `<div class="hitem"><div class="hmeta">${_tm(x.t)} ${ex}</div>✔ 完成 ${_esc(x.d)} 的進度</div>`;
    return "";
  }).join("") || `<p class="hmuted">這個篩選條件下沒有紀錄。</p>`}</div>`;
  root.innerHTML = h;
  root.querySelectorAll(".hday").forEach(b => b.onclick = () => { st.day = b.dataset.d; renderHistory(root, opts); });
  const hx = root.querySelector("#hex"); if (hx) hx.onchange = e => { st.ex = e.target.value; st.day = null; renderHistory(root, opts); };
  root.querySelector("#honly").onchange = e => { st.only = e.target.value; renderHistory(root, opts); };
  const rd = root.querySelector("#hredo"); if (rd) rd.onclick = () => opts.onRedo(badKeys);
}
const HISTORY_CSS = `
.hstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.hstats div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.hstats b{display:block;font-size:22px;color:var(--acc)}.hstats span{font-size:12px;color:var(--muted)}
.htool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.htool select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);color:var(--ink)}
.hdays{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.hday{flex:none;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:center}
.hday b{display:block;font-size:14px}.hday span{font-size:11px;color:var(--muted)}.hday.on{border-color:var(--acc);background:var(--acc2)}
.hhead{margin:6px 0 10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hbtn{font:inherit;font-size:13px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:4px 10px;cursor:pointer}
.hitem{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:var(--card);font-size:14px}
.hitem.ok{border-left-color:var(--greent)}.hitem.bad{border-left-color:var(--redt)}
.hmeta{font-size:12px;color:var(--muted);margin-bottom:2px}.htag{display:inline-block;background:var(--line);border-radius:999px;padding:0 8px;margin:0 4px;font-size:11px}
.hans{font-size:13px;color:var(--muted);margin-top:2px}.hmuted{color:var(--muted)}`;

// 申論題庫：每題 = 題目 + 作答架構 + 記憶口訣
const ESSAYS = [
{id:"E01",s:"企管",t:"有效控制系統的特質",q:"有效的控制系統應具備哪些特質？請說明其內涵。",
a:["【定義】控制是監督各項活動，確保依計畫完成並矯正重大偏差的過程（衡量實績→與標準比較→採取矯正行動）。",
"1. 正確性（Accuracy）：提供可靠資訊，否則會做出錯誤決策。",
"2. 及時性（Timeliness）：在問題擴大前提醒管理者，資訊延遲即失去價值。",
"3. 經濟性（Economy）：控制效益須大於成本，只控制必要之處。",
"4. 彈性（Flexibility）：能隨環境變化調整，掌握威脅與機會。",
"5. 可理解性（Understandability）：使用者看得懂，不懂就無法執行。",
"6. 合理標準（Reasonable criteria）：標準具挑戰但可達成，過高會打擊士氣或誘發舞弊。",
"7. 策略性配置（Strategic placement）：控制放在關鍵績效領域與易出錯的關鍵點。",
"8. 強調例外（Emphasis on exceptions）：只對超出容許範圍的偏差採取行動（例外管理）。",
"9. 多重標準（Multiple criteria）：多個指標衡量，避免只看單一數字。",
"10. 矯正行動（Corrective action）：不只指出問題，還要提出解決方式。",
"【結論】以電信業為例：門市業績用多重指標（新申辦、續約率、客訴率）並即時回報，才能兼顧正確、及時與經濟。"],
tip:"口訣：「正及經彈理，合策例多矯」"},
{id:"E02",s:"行銷",t:"服務的四大特性與因應策略",q:"服務有別於實體產品，請說明服務的四大特性與其行銷管理上的因應。",
a:["【定義】服務是一方提供給另一方、本質上無形且不產生所有權移轉的活動或利益。",
"1. 無形性（Intangibility）：購買前無法看、摸、試用。→ 有形化：實體環境、制服、證照、口碑與保證（如電信門市裝潢、服務承諾）。",
"2. 不可分割性（Inseparability）：生產與消費同時發生，顧客參與其中。→ 訓練第一線人員、教育顧客、增設多據點或線上自助服務。",
"3. 異質性／易變性（Variability）：品質因人、時、地而異。→ 服務標準化（SOP）、人員甄選訓練、監控顧客滿意度。",
"4. 易逝性／不可儲存性（Perishability）：服務無法庫存，需求波動時易閒置或供不應求。→ 需求面：差別定價、預約、離峰優惠；供給面：兼職人力、顧客自助、尖峰效率作業。",
"【延伸】因此服務行銷在 4P 外加入人員（People）、實體環境（Physical evidence）、流程（Process）成為 7P。",
"【結論】以中華電信為例：用 App 自助服務降低不可分割性限制，以標準話術與訓練降低異質性。"],
tip:"口訣：「無形、不可分、異質、易逝」→ 對策「有形化、訓練、標準化、調節供需」"},
{id:"E03",s:"企管",t:"內容型與程序型激勵理論比較",q:"請比較內容型與程序型激勵理論，並各舉兩個理論說明。",
a:["【定義】激勵是激發、引導並維持個人努力以達成目標的過程。",
"一、內容型（探討「什麼」激勵人）：",
"1. Maslow 需求層級：生理→安全→社會→尊重→自我實現；低層次滿足後才追求高層次。",
"2. Herzberg 雙因子：保健因子（薪資、政策、工作環境）只能消除不滿；激勵因子（成就、肯定、責任、成長）才能帶來滿足。",
"3. McClelland 三需求：成就、權力、親和需求。",
"4. Alderfer ERG：生存、關係、成長；可同時存在，有挫折退化現象。",
"二、程序型（探討「如何」被激勵）：",
"1. Vroom 期望理論：激勵力 = 期望（努力→績效）× 工具性（績效→獎酬）× 價值（獎酬吸引力）。",
"2. Adams 公平理論：比較自己與參考對象的投入產出比，不公平時會調整投入或改變參考對象。",
"3. Locke 目標設定理論：具體、困難但被接受的目標並給予回饋，可提高績效。",
"4. 增強理論（Skinner）：行為受結果影響，正增強、負增強、懲罰、消弱。",
"【比較】內容型重視需求本身，程序型重視認知與決策過程；實務上宜併用。",
"【結論】業務單位可用明確業績目標（目標設定）＋公平透明的獎金制度（公平、期望理論）。"],
tip:"內容型：馬赫麥E；程序型：期公目增"},
{id:"E04",s:"企管",t:"Fiedler 權變領導 vs 情境領導",q:"請說明 Fiedler 權變領導理論與 Hersey & Blanchard 情境領導理論，並比較兩者差異。",
a:["一、Fiedler 權變模式：",
"1. 以 LPC（最不喜歡同事）問卷判定領導風格：高 LPC 關係導向、低 LPC 任務導向，風格固定不易改變。",
"2. 情境有利程度三要素：領導者－成員關係、任務結構、職位權力。",
"3. 結論：情境非常有利或非常不利時，任務導向較佳；中度有利時，關係導向較佳。",
"4. 意涵：改變情境或更換領導者以求配適。",
"二、Hersey & Blanchard 情境領導：",
"1. 依部屬成熟度（能力＋意願）R1～R4 調整風格。",
"2. 四種風格：告知（高任務低關係）→ 推銷（高任務高關係）→ 參與（低任務高關係）→ 授權（低任務低關係）。",
"三、比較：",
"1. 情境變數：Fiedler 看整體情境；H&B 只看部屬成熟度。",
"2. 風格可否改變：Fiedler 認為固定；H&B 認為領導者應彈性調整。",
"3. 因應方式：Fiedler 改變情境；H&B 改變領導行為。"],
tip:"Fiedler：LPC＋關係/任務/權力，兩極用任務；H&B：告推參授對 R1-R4"},
{id:"E05",s:"企管",t:"SWOT 與五力分析",q:"請說明 SWOT 分析與 Porter 五力分析，並以電信產業為例說明。",
a:["一、SWOT 分析：",
"1. 內部：優勢 S、劣勢 W；外部：機會 O、威脅 T。",
"2. 策略配對（TOWS）：SO 增長型、WO 扭轉型、ST 多元化型、WT 防禦型。",
"二、Porter 五力分析（產業吸引力）：",
"1. 現有競爭者的競爭強度。2. 潛在進入者威脅。3. 替代品威脅。4. 購買者議價力。5. 供應商議價力。",
"三、電信業舉例：",
"S：固網與海纜基礎建設完整、品牌信任度高；W：組織龐大、決策速度較慢。",
"O：5G/Pre-6G、AI 資料中心、企業數位轉型需求；T：同業價格戰、OTT 通訊軟體替代傳統通話。",
"五力：現有競爭激烈（三大電信）；進入障礙高（頻譜、資本）；替代品威脅高（LINE、OTT）；消費者轉換成本低（攜碼）→ 議價力高；設備供應商集中→ 議價力中高。",
"【結論】電信業應以差異化服務（企業 ICT 解決方案）避開價格戰。"],
tip:"SWOT 內SW外OT；五力：現潛替買供"},
{id:"E06",s:"企管",t:"BCG 矩陣",q:"請說明 BCG 成長占有率矩陣的四個象限及其策略意涵。",
a:["【定義】波士頓顧問公司提出，以「市場成長率」（縱軸）與「相對市場占有率」（橫軸）評估事業單位組合。",
"1. 明星（Star）：高成長、高占有。需大量資金維持成長 → 建立／持有策略。",
"2. 金牛（Cash Cow）：低成長、高占有。現金流量大 → 持有、收割，資金支援明星與問題事業。",
"3. 問題兒童（Question Mark）：高成長、低占有。前景不確定 → 選擇性投資（建立）或撤資。",
"4. 狗（Dog）：低成長、低占有。→ 收割或撤資。",
"【理想循環】金牛的現金投入問題兒童使其成為明星，明星成熟後成為金牛。",
"【限制】只用兩個指標過於簡化；高占有不一定等於高獲利；忽略事業間綜效。",
"【舉例】行動語音像金牛，雲端與 AI 資料中心像明星或問題兒童。"],
tip:"明星金牛問題狗；縱成長、橫占有"},
{id:"E07",s:"行銷",t:"STP 流程與定位策略",q:"請說明 STP 的意義與步驟，並說明常見的定位策略。",
a:["【定義】STP = 市場區隔（Segmentation）→ 選擇目標市場（Targeting）→ 市場定位（Positioning）。",
"一、市場區隔變數：地理、人口統計（年齡、所得）、心理（生活型態、人格）、行為（使用率、利益、忠誠度）；組織市場另有產業、規模、採購方式。",
"有效區隔條件：可衡量、可接近、足量（規模夠大）、可區別、可行動。",
"二、目標市場選擇策略：無差異行銷、差異化行銷、集中行銷（利基）、個人化／微行銷。",
"三、定位：在目標顧客心中建立獨特、有價值的位置。",
"定位方式：依屬性、利益、使用情境、使用者、競爭者、品質／價格、產品類別。",
"定位錯誤：定位不足、過度定位、混淆定位、可疑定位。",
"【舉例】中華電信企業客戶：以中大型企業為目標，定位為「穩定可靠的數位轉型夥伴」。"],
tip:"區隔四變數：地人心行；有效區隔：衡接足別行"},
{id:"E08",s:"行銷",t:"產品生命週期各階段行銷策略",q:"請說明產品生命週期（PLC）各階段的特徵與行銷策略。",
a:["1. 導入期：銷售低、成本高、多為虧損，顧客為創新者。→ 目標建立知名度與試用；產品基本型；吸脂或滲透定價；選擇性通路；大量廣告與促銷試用。",
"2. 成長期：銷售快速上升、開始獲利，競爭者加入。→ 擴大市占；增加功能與服務；價格維持或略降；密集通路；廣告轉向品牌偏好。",
"3. 成熟期：銷售成長趨緩、競爭最激烈、利潤由高峰下降。→ 防守市占、追求最大利潤；調整市場（找新用途、新客群）、調整產品（改良品質功能）、調整行銷組合；價格競爭；強化促銷鼓勵品牌轉換。",
"4. 衰退期：銷售與利潤下滑。→ 降低支出、收割或撤退；淘汰弱勢品項；降價；選擇性通路；推廣降到最低。",
"【舉例】市話處於衰退期 → 收割；5G 方案處於成長期 → 擴大覆蓋與方案組合。"],
tip:"導入求知名、成長搶市占、成熟守利潤、衰退收割退"},
{id:"E09",s:"行銷",t:"品牌權益",q:"何謂品牌權益？請說明其構成要素與建立方式。",
a:["【定義】品牌權益是品牌名稱帶給產品的附加價值，使顧客對有品牌的產品產生不同反應。",
"一、Aaker 品牌權益五要素：",
"1. 品牌知名度（Awareness）：辨識與回憶程度。",
"2. 知覺品質（Perceived quality）。",
"3. 品牌聯想（Associations）：顧客心中與品牌相連的形象。",
"4. 品牌忠誠度（Loyalty）：品牌權益的核心。",
"5. 其他專屬資產：商標、專利、通路關係。",
"二、Keller 以顧客為基礎的品牌權益（CBBE）金字塔：品牌識別 → 品牌意義（績效、形象）→ 品牌回應（判斷、感受）→ 品牌共鳴。",
"三、建立方式：選擇品牌元素（名稱、標誌、口號）、整合行銷溝通、品牌延伸與聯名、維持一致的服務品質。",
"【結論】品牌權益高可帶來溢價、降低行銷成本與提升議價力。"],
tip:"Aaker：知、質、聯、忠、資"},
{id:"E10",s:"行銷",t:"組織購買行為與購買中心",q:"組織市場與消費者市場有何不同？請說明購買中心的角色。",
a:["一、組織市場特性：購買者較少但量大、地理集中、衍生需求、需求缺乏彈性且波動大、專業採購、多人參與決策、重視長期關係、直接採購。",
"二、購買情境：直接重購、修正重購、新購。",
"三、購買中心（Buying center）角色：",
"1. 發起者（Initiator）：提出需求。",
"2. 使用者（User）：實際使用產品。",
"3. 影響者（Influencer）：提供規格與評估意見，如技術人員。",
"4. 決策者（Decider）：決定供應商。",
"5. 批准者（Approver）：授權決策。",
"6. 採購者（Buyer）：執行採購、議價。",
"7. 守門者（Gatekeeper）：控制資訊流向，如秘書、採購助理。",
"四、購買決策過程：認知問題→描述需求→產品規格→尋找供應商→徵求提案→選擇供應商→訂購→績效評估。",
"【實務】中華電信企業客戶業務需找出決策者與影響者，針對 IT 主管談技術、對財務主管談成本效益。"],
tip:"購買中心：發使影決批採守"},
{id:"E11",s:"行銷",t:"CRM 與顧客終身價值",q:"請說明顧客關係管理（CRM）的意義與顧客終身價值的概念。",
a:["【CRM 定義】透過蒐集、分析顧客資料，提供卓越的顧客價值與滿意度，以建立並維持有利可圖的長期顧客關係。",
"一、CRM 類型：作業型（行銷、銷售、服務自動化）、分析型（資料倉儲、資料探勘）、協同型（多通路整合互動）。",
"二、CRM 循環：顧客資料蒐集 → 分析與區隔 → 設計個人化行銷 → 執行與互動 → 評估回饋。",
"三、顧客終身價值（CLV）：顧客在整個往來期間所帶來利潤的現值。",
"意涵：留住舊客成本低於開發新客，應依 CLV 區分顧客並分配資源。",
"四、關係層次：基本關係 → 完整夥伴關係；忠誠方案：財務利益、社交利益、結構性連結。",
"【舉例】電信業以合約續約優惠、會員點數與家庭方案綁定提升 CLV、降低流失率。"],
tip:"CRM 三型：作業、分析、協同"},
{id:"E12",s:"企管",t:"目標管理（MBO）",q:"何謂目標管理？請說明其步驟與優缺點。",
a:["【定義】Drucker 提出，由主管與部屬共同設定具體目標，定期檢討進度，並依目標達成程度給予獎酬的管理制度。",
"一、四要素：目標具體、參與決策、明確期限、績效回饋。",
"二、步驟：1. 設定組織整體目標與策略 → 2. 分配至各部門 → 3. 部門主管與上級共同設定部門目標 → 4. 與部屬共同設定個人目標 → 5. 擬定行動計畫 → 6. 執行並定期檢討 → 7. 依達成度給予獎酬。",
"三、優點：目標明確提升績效；參與提高承諾與士氣；上下目標一致；作為績效評估依據。",
"四、缺點：耗費時間；過度重視可量化的短期目標；環境變動大時目標易失效；部門本位主義。",
"【結論】可與 OKR 或 KPI 搭配，兼顧挑戰性與彈性。"],
tip:"MBO 四要素：具、參、期、回"},
{id:"E13",s:"企管",t:"Lewin 變革模式與抗拒變革",q:"請說明 Lewin 的變革三步驟，以及組織成員抗拒變革的原因與管理方式。",
a:["一、Lewin 三步驟：",
"1. 解凍（Unfreezing）：打破現狀，增加推動力、降低阻力。",
"2. 變革（Changing／Moving）：導入新行為、制度或技術。",
"3. 再凍結（Refreezing）：以制度與獎酬鞏固新行為，避免回到原狀。",
"二、抗拒原因：不確定性、擔心個人損失（地位、薪資）、認為變革不符組織利益、習慣與惰性。",
"三、Kotter & Schlesinger 六種降低抗拒方法：",
"1. 教育與溝通 2. 參與 3. 促進與支持 4. 協商 5. 操縱與吸收 6. 強制。",
"【補充】Kotter 八步驟：建立急迫感、組成領導聯盟、建立願景、溝通願景、授權行動、創造短期成效、鞏固成果、制度化。"],
tip:"解凍→變革→再凍結；降抗拒：教參支協操強"},
{id:"E14",s:"企管",t:"全面品質管理（TQM）",q:"請說明全面品質管理（TQM）的意義與核心概念。",
a:["【定義】全員參與、以顧客為導向、持續改善所有流程的品質管理哲學（Deming、Juran）。",
"核心概念：",
"1. 顧客導向：品質由顧客定義，含內部與外部顧客。",
"2. 持續改善（Kaizen）：永不滿足現狀，PDCA 循環（Plan-Do-Check-Act）。",
"3. 全員參與：從高階到基層，品管圈（QCC）與授權。",
"4. 流程導向：改善工作流程而不只檢驗結果。",
"5. 以事實為基礎的決策：統計工具（管制圖、柏拉圖、魚骨圖）。",
"6. 團隊合作與供應商夥伴關係。",
"【延伸】六標準差：DMAIC（定義、衡量、分析、改善、控制），目標每百萬次機會 3.4 個缺點。",
"【結論】電信業可用於降低斷線率、客訴處理時間等服務品質指標。"],
tip:"TQM：顧、持、全、流、事、團；PDCA"},
{id:"E15",s:"行銷",t:"整合行銷溝通與推廣組合",q:"何謂整合行銷溝通（IMC）？請說明推廣組合的工具與特性。",
a:["【IMC 定義】整合協調所有溝通管道，傳遞清楚、一致且具說服力的品牌訊息。",
"推廣組合五大工具：",
"1. 廣告：非人員、付費、觸及廣、可重複；成本高、單向。",
"2. 銷售促進：短期誘因（折扣、贈品、試用）刺激購買；效果快但短暫，可能傷害品牌。",
"3. 公共關係：建立良好形象（新聞稿、贊助、CSR）；可信度高、成本低，但不易控制。",
"4. 人員銷售：面對面雙向溝通、可客製化、建立關係；成本最高，適合 B2B 與高價複雜產品。",
"5. 直效與數位行銷：一對一、可衡量（Email、社群、App 推播）。",
"推廣策略：推式策略（推廣導向通路商）vs 拉式策略（推廣導向最終消費者）。",
"影響組合選擇：產品類型、PLC 階段、購買準備階段、推拉策略。",
"【舉例】中華電信企業客戶以人員銷售為主，搭配研討會與案例行銷；消費者市場以廣告＋促銷為主。"],
tip:"廣促公人直；推式對通路、拉式對消費者"},
{id:"E16",s:"行銷",t:"行銷觀念的演進",q:"請說明行銷觀念的演進過程。",
a:["1. 生產觀念：消費者偏好便宜易得的產品 → 提高生產與配銷效率。",
"2. 產品觀念：消費者偏好品質最好的產品 → 不斷改良，易導致行銷近視病。",
"3. 銷售觀念：不積極推銷消費者就不買 → 強力推銷，重視賣出而非滿足需求。",
"4. 行銷觀念：了解目標市場需求，比競爭者更有效提供滿足 → 由外而內、顧客導向。",
"5. 社會行銷觀念：兼顧消費者需求、企業利潤與社會長期福祉。",
"6. 全方位行銷：關係行銷、整合行銷、內部行銷、績效（社會責任）行銷。",
"【比較】銷售觀念：由內而外、以產品為中心、靠推銷獲利；行銷觀念：由外而內、以顧客為中心、靠顧客滿意獲利。"],
tip:"生產→產品→銷售→行銷→社會→全方位"},
{id:"E17",s:"企管",t:"群體決策技術",q:"請說明群體決策的優缺點與常見的群體決策技術。",
a:["一、優點：資訊與觀點較完整、方案較多、提高接受度與合法性。",
"缺點：耗時、少數人主導、從眾壓力、權責不清、群體思維（Groupthink）。",
"二、群體決策技術：",
"1. 腦力激盪法：鼓勵自由發想、不批評、重量不重質、可搭便車。",
"2. 名目群體技術（NGT）：成員先獨立寫下想法，再逐一發表、討論、投票排序；避免從眾。",
"3. 德爾菲法（Delphi）：專家匿名、多回合問卷回饋直到共識；不需面對面，耗時。",
"4. 電子會議：匿名、即時、同步表達。",
"5. 魔鬼代言人法、辯證法：刻意提出反對意見以避免群體思維。"],
tip:"腦名德電魔"},
{id:"E18",s:"行銷",t:"人員銷售流程",q:"請說明人員銷售的步驟。",
a:["1. 開發與篩選潛在顧客（Prospecting & qualifying）：找出合格名單（需求、購買力、決策權）。",
"2. 事前準備（Preapproach）：了解客戶公司、決策者、購買方式，設定拜訪目標。",
"3. 接觸（Approach）：建立良好第一印象、開場。",
"4. 展示與說明（Presentation）：以顧客需求為導向（AIDA、需求滿足法），說明效益而非只講功能。",
"5. 處理異議（Handling objections）：傾聽、釐清、轉化為購買理由。",
"6. 成交（Closing）：辨識購買訊號，提出成交要求。",
"7. 追蹤與維繫（Follow-up）：確認交付與滿意度，建立長期關係、爭取續約與加購。",
"【延伸】顧問式銷售：從推銷產品轉為協助客戶解決問題，適合企業 ICT 方案。"],
tip:"開準接展異成追"},
{id:"E19",s:"行銷",t:"服務品質缺口模式（PZB）",q:"請說明 PZB 服務品質缺口模式與 SERVQUAL 構面。",
a:["一、五大缺口：",
"缺口1：顧客期望 vs 管理者對顧客期望的認知（不了解顧客）。",
"缺口2：管理者認知 vs 服務品質規格（標準設定不當）。",
"缺口3：服務品質規格 vs 實際服務傳遞（員工未依標準執行）。",
"缺口4：服務傳遞 vs 外部溝通（過度承諾）。",
"缺口5：顧客期望的服務 vs 顧客知覺的服務（＝前四缺口的總和）。",
"二、SERVQUAL 五構面：",
"1. 有形性：設施、設備、人員外表。2. 可靠性：可靠且正確地履行承諾。3. 回應性：協助顧客並提供即時服務。4. 保證性：員工知識、禮貌與可信度。5. 同理心：個別關懷。",
"【結論】可藉顧客調查、制定 SOP、員工訓練、避免廣告過度承諾來縮小缺口。"],
tip:"SERVQUAL：有可回保同（RATER）"},
{id:"E20",s:"行銷",t:"數位轉型與 AI 對電信業行銷的影響",q:"請說明數位轉型與 AI 對電信業行銷的影響。",
a:["一、數位行銷特性：精準、即時、互動、可衡量。",
"二、AI 的應用：",
"1. 大數據分析與顧客分群：依使用行為預測流失（churn prediction）並主動挽留。",
"2. 個人化推薦：依用量推薦合適資費、加值服務。",
"3. 智慧客服：聊天機器人 24 小時回應，降低客服成本。",
"4. 動態定價與行銷自動化。",
"三、對電信業的影響：",
"1. 由賣連線轉為賣解決方案（雲端、資安、IoT、AI 資料中心）。",
"2. 全通路整合：門市、App、官網體驗一致（OMO）。",
"3. 企業客戶需要顧問式銷售與產業解決方案。",
"四、挑戰：個資保護與資安、組織人才轉型、數位落差。"],
tip:"AI：分群、推薦、客服、自動化；挑戰：個資、人才、落差"},
{id:"E21",s:"行銷",t:"新產品開發流程",q:"請說明新產品開發流程。",
a:["1. 創意產生：內部（員工、研發）、外部（顧客、競爭者、通路）。",
"2. 創意篩選：剔除不可行構想，避免「放棄錯誤」與「採用錯誤」。",
"3. 概念發展與測試：將構想轉成具體產品概念，找目標顧客測試反應。",
"4. 行銷策略發展：目標市場、定位、第一年 4P 與長期目標。",
"5. 商業分析：估計銷售量、成本與利潤。",
"6. 產品發展：做出原型。",
"7. 試銷：小範圍市場測試。",
"8. 商業化：決定上市時間、地點、目標與策略。",
"【補充】新產品擴散：創新者 2.5% → 早期採用者 13.5% → 早期大眾 34% → 晚期大眾 34% → 落後者 16%。"],
tip:"創篩概策商發試商"},
{id:"E22",s:"行銷",t:"定價策略",q:"請說明新產品定價策略與常見的心理定價方法。",
a:["一、定價考量：成本（下限）、顧客知覺價值（上限）、競爭者、公司目標、法規。",
"二、定價方法：成本加成、損益兩平（目標利潤）、價值基礎、競爭基礎（追隨定價、競標）。",
"三、新產品定價：",
"1. 吸脂定價：高價上市，適合品質形象佳、需求缺乏彈性、競爭者不易進入。",
"2. 滲透定價：低價快速取得市占，適合需求彈性大、規模經濟明顯。",
"四、產品組合定價：產品線定價、選購品定價、專屬產品定價（印表機與墨水）、副產品、組合定價（綁約方案）。",
"五、心理定價：尾數定價（999）、聲望定價、參考價格。",
"六、其他：差別定價（時段、顧客、地點）、促銷定價、動態定價。",
"【舉例】電信資費常用組合定價與差別定價（學生、家庭方案）。"],
tip:"新品：吸脂 vs 滲透；心理：尾數、聲望、參考"},
{id:"E23",s:"企管",t:"管理者的角色與技能",q:"請說明 Mintzberg 的管理者角色與 Katz 的管理技能。",
a:["一、Mintzberg 十種角色：",
"1. 人際角色：頭臉人物、領導者、聯絡人。",
"2. 資訊角色：監督者、傳播者、發言人。",
"3. 決策角色：企業家、危機處理者、資源分配者、協商者。",
"二、Katz 三種技能：",
"1. 技術性技能：執行特定工作的專業能力，基層最需要。",
"2. 人際性技能：與他人合作、溝通、激勵的能力，各層級皆重要。",
"3. 概念性技能：分析與判斷整體情勢的能力，高階最需要。",
"三、管理功能：規劃、組織、領導、控制（POLC）。"],
tip:"人際/資訊/決策；技術-人際-概念（由基層到高階）"},
{id:"E24",s:"企管",t:"企業社會責任（CSR）",q:"何謂企業社會責任？請說明 Carroll 的 CSR 金字塔及兩種觀點。",
a:["一、兩種觀點：",
"1. 古典觀點（Friedman）：企業唯一責任是在合法前提下為股東創造最大利潤。",
"2. 社會經濟觀點：企業應兼顧利害關係人與社會福祉。",
"二、Carroll 金字塔（由下而上）：經濟責任 → 法律責任 → 倫理責任 → 慈善責任。",
"三、相關概念：社會義務（法律最低要求）→ 社會回應（因應社會需求）→ 社會責任（追求長期社會利益）。",
"四、ESG：環境（Environmental）、社會（Social）、公司治理（Governance）。",
"【舉例】中華電信簽訂綠電長約、推動偏鄉數位培力即屬 CSR／ESG 實踐。"],
tip:"Carroll：經法倫慈；ESG"},
{id:"E25",s:"企管",t:"組織結構：機械式 vs 有機式",q:"請比較機械式組織與有機式組織，並說明影響組織設計的權變因素。",
a:["一、組織設計六要素：工作專業化、部門化、指揮鏈、控制幅度、集權/分權、正式化。",
"二、比較：",
"機械式：高度專業化、部門分明、指揮鏈清楚、控制幅度窄、集權、高度正式化 → 適合穩定環境。",
"有機式：跨功能團隊、跨層級溝通、資訊自由流通、控制幅度寬、分權、低度正式化 → 適合動態環境。",
"三、權變因素：",
"1. 策略：成本領導 → 機械式；創新差異化 → 有機式。",
"2. 規模：大型組織較機械式。",
"3. 技術（Woodward）：單位生產與連續生產 → 有機式；大量生產 → 機械式。",
"4. 環境不確定性：越動態越有機式。"],
tip:"權變：策略、規模、技術、環境"},
{id:"E26",s:"企管",t:"Porter 一般性競爭策略",q:"請說明 Porter 的三種一般性競爭策略。",
a:["1. 成本領導：成為產業內成本最低者，靠規模經濟、經驗曲線、效率作業。風險：技術變革、競爭者模仿。",
"2. 差異化：提供顧客重視的獨特價值（品質、品牌、服務、技術），可訂較高價格。風險：差異不被顧客重視、溢價過高。",
"3. 集中（焦點）：鎖定特定區隔，再分成本集中與差異化集中。風險：區隔過小、大廠進入。",
"【卡在中間】未明確選擇任一策略者，易陷入低獲利。",
"【舉例】中華電信以網路品質與企業服務差異化；部分小型電信或 MVNO 採低價集中策略。"],
tip:"成本、差異、集中；避免卡在中間"},
{id:"E27",s:"企管",t:"績效評估方法",q:"請說明常見的績效評估方法與評估誤差。",
a:["一、評估方法：",
"1. 書面評語法 2. 重要事件法 3. 圖表評等尺度法 4. 行為定錨評等法（BARS） 5. 目標管理法（MBO） 6. 多人比較法（排序、配對比較、強迫分配） 7. 360 度回饋。",
"二、常見誤差：",
"1. 月暈效果：以單一特質影響整體評價。2. 寬大／嚴苛誤差。3. 趨中誤差。4. 近因效應：只看最近表現。5. 相似誤差：偏好與自己相似者。6. 刻板印象。",
"三、改善：多位評估者、評估者訓練、以行為與結果為標準、平時記錄重要事件。"],
tip:"誤差：月寬趨近似刻"},
{id:"E28",s:"行銷",t:"行銷組合 4P 與 4C",q:"請說明行銷組合 4P 與 4C 的內涵及對應關係。",
a:["一、4P（McCarthy，賣方觀點）：產品 Product、價格 Price、通路 Place、推廣 Promotion。",
"二、4C（Lauterborn，買方觀點）：",
"1. 顧客解決方案／需求（Customer solution）↔ 產品。",
"2. 顧客成本（Customer cost）↔ 價格：不只金錢，也包含時間、精力。",
"3. 便利性（Convenience）↔ 通路。",
"4. 溝通（Communication）↔ 推廣：雙向互動取代單向說服。",
"三、服務業 7P：加上人員、實體環境、流程。",
"【結論】行銷人應先從 4C 思考顧客價值，再以 4P 落實。"],
tip:"4P 對 4C：產-解、價-本、通-便、推-溝"},
{id:"E29",s:"行銷",t:"通路階層與通路衝突",q:"請說明行銷通路的功能、通路密度策略與通路衝突。",
a:["一、通路功能：資訊、推廣、接觸、配合、協商、實體配送、融資、風險承擔。",
"二、通路階層：零階（直銷）、一階（零售商）、二階（批發＋零售）、三階。",
"三、通路密度：密集式（便利品）、選擇式（選購品）、獨家式（特殊品、高級品牌）。",
"四、垂直行銷系統（VMS）：公司式、契約式（加盟）、管理式。",
"五、通路衝突：水平衝突（同層級間）、垂直衝突（不同層級間）。",
"處理方式：明確角色分工、共同目標、溝通協調、仲裁。",
"【舉例】電信業有直營門市、加盟門市、網路門市，需避免價格不一引起的垂直衝突。"],
tip:"密集-選擇-獨家；水平 vs 垂直衝突"},
{id:"E30",s:"行銷",t:"消費者購買決策過程",q:"請說明消費者購買決策過程與購買行為類型。",
a:["一、五階段：",
"1. 問題認知：內外部刺激引發需求。",
"2. 資訊蒐集：個人、商業、公共、經驗來源。",
"3. 方案評估：依屬性與重要性形成態度。",
"4. 購買決策：受他人態度與非預期情境因素影響。",
"5. 購後行為：滿意或失調（購後失調），影響口碑與再購。",
"二、Assael 四種購買行為（涉入程度 × 品牌差異）：",
"高涉入＋差異大：複雜型購買；高涉入＋差異小：降低失調型；低涉入＋差異小：習慣型；低涉入＋差異大：尋求多樣化型。",
"三、影響因素：文化、社會（參考群體、家庭、角色）、個人（年齡、職業、生活型態）、心理（動機、知覺、學習、信念）。"],
tip:"問、資、評、購、後；影響：文社個心"},
{id:"E31",s:"企管",t:"組織文化",q:"何謂組織文化？請說明其構面與功能。",
a:["【定義】組織成員共享的價值觀、信念與行為規範，影響成員的行為方式。",
"一、Schein 三層次：人造器物（可見的符號、儀式）→ 信奉的價值觀 → 基本假設。",
"二、組織文化七構面：創新與冒險、注重細節、結果導向、人員導向、團隊導向、積極進取、穩定性。",
"三、強勢文化 vs 弱勢文化：強勢文化價值觀被廣泛接受，對行為影響大。",
"四、文化傳承：故事、儀式、實體象徵、語言。",
"五、功能：建立認同、提升承諾、穩定社會系統、引導行為；負面：阻礙變革、阻礙多元、阻礙併購。"],
tip:"Schein：器物、價值、假設"},
{id:"E32",s:"企管",t:"權力來源",q:"請說明 French & Raven 的五種權力基礎。",
a:["一、職位權力（正式權力）：",
"1. 法定權：來自組織職位。",
"2. 獎賞權：能給予獎勵。",
"3. 強制權：能施以懲罰。",
"二、個人權力：",
"4. 專家權：來自專業知識與技能。",
"5. 參考權：來自個人魅力、受人欣賞認同。",
"（後續補充：資訊權）",
"【結論】個人權力較能帶來成員承諾，強制權易引發抗拒。"],
tip:"法賞強專參"},
{id:"E33",s:"企管",t:"轉換型 vs 交易型領導",q:"請比較轉換型領導與交易型領導。",
a:["一、交易型領導：以獎懲交換績效，釐清角色與任務要求。",
"構面：權宜獎酬、例外管理（主動／被動）。",
"二、轉換型領導：激發部屬超越自身利益，追求組織願景。",
"4I 構面：1. 理想化影響（魅力） 2. 激勵鼓舞 3. 智力啟發 4. 個別關懷。",
"三、比較：交易型著重短期、維持現狀；轉換型著重長期、推動變革，績效與滿意度通常較高。",
"四、兩者並非對立，轉換型建立在交易型的基礎上。"],
tip:"轉換型 4I：魅、鼓、啟、關"},
{id:"E34",s:"企管",t:"溝通障礙與改善",q:"請說明組織溝通的障礙及改善方法。",
a:["一、溝通過程：發訊者 → 編碼 → 訊息 → 管道 → 解碼 → 收訊者 → 回饋，中間有噪音。",
"二、障礙：過濾、選擇性知覺、資訊超載、情緒、防衛心理、語言差異、國家文化、性別差異。",
"三、改善方法：運用回饋、簡化語言、積極傾聽、控制情緒、注意非語言線索。",
"四、溝通網路：鏈型、輪型、全通道型；非正式溝通有葡萄藤（小道消息）。"],
tip:"障礙：過選超情防語；改善：回簡聽控非"},
{id:"E35",s:"企管",t:"Ansoff 產品市場擴張矩陣",q:"請說明 Ansoff 成長矩陣的四種策略。",
a:["以「現有/新產品」×「現有/新市場」形成四種成長策略：",
"1. 市場滲透：現有產品＋現有市場，提高使用量、搶競爭者顧客，風險最低。",
"2. 市場開發：現有產品＋新市場，如新地區、新客群。",
"3. 產品開發：新產品＋現有市場。",
"4. 多角化：新產品＋新市場，風險最高；又分相關與非相關多角化。",
"【舉例】中華電信把既有網路服務推向海外市場（市場開發）；對既有企業客戶推出 AI 雲端服務（產品開發）。"],
tip:"滲透、市場開發、產品開發、多角化"},
{id:"E36",s:"行銷",t:"市場競爭地位策略",q:"請說明市場領導者、挑戰者、追隨者與利基者的競爭策略。",
a:["1. 市場領導者：擴大整體市場（新用戶、新用途）、保護市占（陣地、側翼、先發制人、反擊、機動、收縮防禦）、提高市占。",
"2. 市場挑戰者：攻擊領導者或同規模者；正面攻擊、側翼攻擊、包圍攻擊、迂迴攻擊、游擊攻擊。",
"3. 市場追隨者：模仿為主，降低成本與風險；仿製者、近似者、改良者。",
"4. 市場利基者：專精於大企業忽略的小區隔（依顧客、地區、產品專業化）。"],
tip:"領導守、挑戰攻、追隨仿、利基專"},
{id:"E37",s:"行銷",t:"行銷環境分析",q:"請說明行銷的個體環境與總體環境。",
a:["一、個體環境（與公司直接相關）：公司內部、供應商、行銷中介（經銷商、物流、金融）、競爭者、公眾、顧客。",
"二、總體環境（PESTEL）：政治、經濟、社會文化、科技、環境（自然）、法律；另有人口統計環境。",
"三、管理者應監測環境變化，主動因應而非被動反應。",
"【舉例】電信業受 NCC 法規、頻譜政策（政治法律）、AI 與 5G（科技）、少子高齡化（人口）影響。"],
tip:"個體：公供中競公顧；總體：PESTEL"},
{id:"E38",s:"企管",t:"人力資源管理流程",q:"請說明人力資源管理的主要流程。",
a:["1. 人力資源規劃：評估現有人力、預測未來需求、擬定差距方案。",
"2. 招募：內部招募（升遷、調動）、外部招募（網路、校園、獵才）。",
"3. 甄選：申請表、筆試、面試、背景調查；重視信度與效度。",
"4. 新進人員引導（Orientation）。",
"5. 訓練與發展：工作中訓練（OJT、輪調）與工作外訓練。",
"6. 績效管理。",
"7. 薪酬與福利：依職位、技能、績效。",
"8. 職涯發展與勞資關係。"],
tip:"規招甄引訓績薪"},
{id:"E39",s:"企管",t:"決策模式",q:"請比較理性決策模式與有限理性決策模式。",
a:["一、決策過程：確認問題 → 確定決策準則 → 分配權重 → 發展方案 → 分析方案 → 選擇方案 → 執行 → 評估成效。",
"二、理性決策：假設資訊完整、目標清楚、可評估所有方案並選出最佳解（最佳化）。",
"三、有限理性（Simon）：受資訊、時間與認知能力限制，選擇「滿意解」而非最佳解；易受承諾升高影響。",
"四、直覺決策：依經驗、情感、價值觀快速判斷。",
"五、問題類型：結構化問題 → 程式化決策（程序、規則、政策）；非結構化問題 → 非程式化決策。",
"六、決策情境：確定、風險、不確定（樂觀、悲觀、遺憾準則）。"],
tip:"理性求最佳、有限理性求滿意"},
{id:"E40",s:"企管",t:"規劃的類型",q:"請說明規劃的意義、類型與重要性。",
a:["【定義】規劃是設定目標、擬定策略與發展計畫以協調活動的過程。",
"一、重要性：提供方向、降低不確定性、減少浪費、建立控制標準。",
"二、類型：",
"1. 依範圍：策略性計畫（整體、長期）vs 作業性計畫（具體細節）。",
"2. 依時間：長期、短期。",
"3. 依明確度：具體計畫 vs 方向性計畫。",
"4. 依使用頻率：單一用途計畫 vs 常設計畫（政策、程序、規則）。",
"三、目標設定方法：傳統目標設定（由上而下）、目標管理（MBO）。",
"四、權變因素：組織層級、環境不確定性、未來承諾的長度。"]
,tip:"範圍、時間、明確度、使用頻率"}

function quizHTML(keys, opts = {}) {

  return `<div class="quiz">` + keys.map((k, n) => {

      if (qel.classList.contains("answered")) return;
      qel.classList.add("answered");
      const i = +b.dataset.i, ok = i === q.a;
      qel.querySelectorAll(".opt")[q.a].classList.add("right");
      if (!ok) b.classList.add("bad");
      if (ok) { if (wrong[k]) { delete wrong[k]; } } else { wrong[k] = (wrong[k] || 0) + 1; }
      Log.add({ ex: "cht", ty: "q", k, q: q.q, a: q.o[i], c: q.o[q.a], ok, src: q.src });
      saveAll();
      const ex = $(".exp", qel); ex.hidden = false;
      ex.innerHTML = `<b>${ok ? "答對了" : "正解：" + "ABCD"[q.a]}</b>　${esc(q.x)}${!ok ? "（已加入錯題本）" : ""}`;
      updateBadges();
    });
  });
}
function essayHTML(id, mode = "new") {
  const e = EMAP[id]; if (!e) return "";
  const r = rate[id];
  const label = mode === "timed" ? "計時寫作" : mode === "review" ? "默寫複習" : "今日新背";
  const hide = mode !== "new";
  return `<div class="essay" data-id="${id}">
    <div class="ehead"><span class="tag ${e.s === "企管" ? "teal" : "orange"}">${e.s}</span><span class="tag">${label}</span>
      ${r != null ? `<span class="tag rtag ${["red","yellow","green"][r]}">${["忘了","模糊","熟了"][r]}</span>` : ""}</div>
    <h3>${esc(e.t)}</h3>
    <p class="eq">題目：${esc(e.q)}</p>
    ${mode === "timed" ? `<div class="timer"><span class="tval">25:00</span><button class="btn sm tstart">開始計時</button></div>` : ""}
    <button class="btn sm toggle">${hide ? "先自己默寫，再看架構" : "收起架構"}</button>
    <div class="ans" ${hide ? "hidden" : ""}>
      <ul>${e.a.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <p class="tip">🔑 ${esc(e.tip)}</p>
    </div>
    <div class="rate">記得多少？ <button class="btn sm" data-r="2">熟了</button><button class="btn sm" data-r="1">模糊</button><button class="btn sm" data-r="0">忘了</button></div>
  </div>`;
}
function bindEssays(root) {
  root.querySelectorAll(".essay").forEach(el => {
    const t = $(".toggle", el), a = $(".ans", el);
    t.onclick = () => { a.hidden = !a.hidden; t.textContent = a.hidden ? "看架構" : "收起架構"; };
    el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { const v = +b.dataset.r; rate[el.dataset.id] = v; saveAll(); Log.add({ ex: "cht", ty: "e", id: el.dataset.id, title: EMAP[el.dataset.id].t, r: v });
      let t = $(".rtag", el); if (!t) { t = document.createElement("span"); $(".ehead", el).appendChild(t); }
      t.className = "tag rtag " + ["red","yellow","green"][v]; t.textContent = ["忘了","模糊","熟了"][v]; });
    const ts = $(".tstart", el);
    if (ts) { let left = 1500, h = null; ts.onclick = () => {
      if (h) { clearInterval(h); h = null; ts.textContent = "繼續"; return; }
      ts.textContent = "暫停";
      h = setInterval(() => { left--; $(".tval", el).textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
        if (left <= 0) { clearInterval(h); $(".tval", el).textContent = "時間到！"; } }, 1000); }; }
  });
}
function vocabHTML(start, n = 8) {
  const w = []; for (let i = 0; i < n; i++) w.push(VOCAB[(start + i) % VOCAB.length]);
  return `<div class="vocab">${w.map(([en, zh]) => `<button class="vc"><span class="en">${esc(en)}</span><span class="zh">${esc(zh)}</span></button>`).join("")}</div>
  <p class="muted small">點單字翻面看中文。先看英文自己說出意思。</p>`;
}
function bindVocab(root) { root.querySelectorAll(".vc").forEach(b => b.onclick = () => b.classList.toggle("show")); }
function chapterNotes(c) {
  return `<div class="notes"><h3><span class="tag ${c.s === "企管" ? "teal" : "orange"}">${c.s}</span> ${esc(c.t)}</h3>
  <ul>${c.p.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
  ${c.e.length ? `<p class="small">相關申論：${c.e.map(id => `<a href="#essays" data-jump="${id}">${esc(EMAP[id].t)}</a>`).join("、")}</p>` : ""}</div>`;
}
const sec = (title, body, cls = "") => `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const weekWords = d => { // 本週學過的單字
  const i = SCHEDULE.findIndex(x => x.d === d.d); const s = [];
  for (let j = Math.max(0, i - 6); j <= i; j++) if (SCHEDULE[j].vocab != null) s.push(SCHEDULE[j].vocab);
  return s;
};

// ===== 頁面 =====
function pageToday() {
  const d = SCHEDULE.find(x => x.d === curDate);
  const idx = SCHEDULE.indexOf(d);
  let h = `<div class="daybar">
    <button class="btn" id="prev" ${idx === 0 ? "disabled" : ""}>‹ 前一天</button>
    <div class="dayinfo"><input type="date" id="dpick" value="${d.d}" min="${SCHEDULE[0].d}" max="${SCHEDULE[SCHEDULE.length - 1].d}">
      <div>星期${d.w}・<span class="tag">${esc(d.phase)}</span></div></div>
    <button class="btn" id="next" ${idx === SCHEDULE.length - 1 ? "disabled" : ""}>後一天 ›</button></div>`;
  if (d.note) h += `<div class="notice">📌 ${esc(d.note)}</div>`;
  h += `<div class="summary"><b>今日安排</b><br>${esc(d.pro)}<br>${esc(d.eng)}</div>`;

  if (d.type === "econ") return h + sec("📘 經濟學日", `<p>週六留給經濟學，這個系統今天不排中華電信的進度。</p><p class="muted">有空的話可以翻一下錯題本，但不強求。</p>`);
  if (d.type === "exam") return h + sec("📝 考試日", `<p>深呼吸。申論先列小標題再展開，每題控制在 20–25 分鐘。</p>`);

  if (d.essayNew) h += sec("✍️ 申論・今日新背（約 25 分）", essayHTML(d.essayNew, "new"));
  if (d.essayTimed) h += sec("⏱️ 申論・計時寫作（25 分）", `<p class="muted small">先在紙上寫完再展開架構對照，缺漏的點用紅筆補上。</p>` + essayHTML(d.essayTimed, "timed"));
  if (d.review && d.review.length) h += sec(d.type === "study" ? "🔁 申論・默寫昨天的題目（約 15 分）" : "🔁 申論・默寫複習",
    `<p class="muted small">先遮住架構，把小標題寫在紙上，再打開對照，最後按「熟了／模糊／忘了」。</p>` + d.review.map(id => essayHTML(id, "review")).join(""));

  if (d.chapter) { const c = CMAP[d.chapter];
    h += sec("📖 今日章節重點（約 30 分）", chapterNotes(c));
    h += sec("✅ 章節練習題（約 20 分）", quizHTML(c.q.map((_, i) => `${c.id}-${i}`))); }
  if (d.quizChapters) {
    const ks = d.quizChapters.flatMap(id => CMAP[id].q.map((_, i) => `${id}-${i}`));
    h += sec("📚 今日刷題章節", d.quizChapters.map(id => chapterNotes(CMAP[id])).join("") + `<h3 class="sub">練習題</h3>` + quizHTML(ks)); }
  if (d.quizMix) h += sec("🎯 混合題庫 20 題", quizHTML(shuffle(Object.keys(QBANK).filter(k => /^[MK]/.test(k))).slice(0, 20)));
  if (d.wrong) { const ks = Object.keys(wrong).filter(k => QBANK[k]);
    h += sec("❌ 錯題本重做", quizHTML(shuffle(ks).slice(0, 15), { empty: "目前沒有錯題 🎉" })); }

  if (d.type === "study" && d.grammar != null) { const g = GRAMMAR[d.grammar];
    h += sec("🔤 英文單字（約 10 分）", vocabHTML(d.vocab));
    h += sec(`📝 英文文法：${esc(g.t)}（約 20 分）`, `<ul>${g.p.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` + quizHTML(g.q.map((_, i) => `${g.id}-${i}`)) + `<p class="muted small">再搭配你手上的單字書照進度表背 20 個新字。</p>`); }
  if (d.vocabReview) { const ws = weekWords(d);
    h += sec("🔤 本週單字快速複習", ws.length ? ws.map(s => vocabHTML(s)).join("") : `<p class="muted">本週還沒有新單字。</p>`); }
  if (d.logic) h += sec("🧩 邏輯思維 3 題", quizHTML(d.logic.map(i => `L${i}`)));

  h += `<div class="donebar"><label><input type="checkbox" id="donechk" ${done[d.d] ? "checked" : ""}> 今天的進度完成了</label></div>`;
  return h;
}
function pageEssays() {
  const f = store.get("efilter", "全部"), memo = store.get("ememo", true);
  const list = ESSAYS.filter(e => f === "全部" || e.s === f || (f === "未熟" && rate[e.id] !== 2));
  const firstDay = {}; SCHEDULE.forEach(x => { if (x.essayNew && !firstDay[x.essayNew]) firstDay[x.essayNew] = x.d; });
  return `<div class="toolbar">${["全部","企管","行銷","未熟"].map(x => `<button class="btn sm ${x === f ? "on" : ""}" data-ef="${x}">${x}</button>`).join("")}
    <label class="small"><input type="checkbox" id="memo" ${memo ? "checked" : ""}> 背誦模式（先隱藏架構）</label></div>
    <p class="muted small">共 ${ESSAYS.length} 題；已熟 ${ESSAYS.filter(e => rate[e.id] === 2).length} 題。題目旁的日期是排定開始背的那天。</p>` +
    list.map(e => `<div class="card" id="e-${e.id}"><p class="small muted">${e.id}${firstDay[e.id] ? "・" + firstDay[e.id].slice(5).replace("-", "/") + " 開始背" : ""}</p>${essayHTML(e.id, memo ? "review" : "new")}</div>`).join("");
}
function pageNotes() {
  const f = store.get("nfilter", "企管");
  return `<div class="toolbar">${["企管","行銷","英文文法"].map(x => `<button class="btn sm ${x === f ? "on" : ""}" data-nf="${x}">${x}</button>`).join("")}</div>` +
    (f === "英文文法" ? GRAMMAR.map(g => `<section class="card"><h3>${esc(g.t)}</h3><ul>${g.p.map(p => `<li>${esc(p)}</li>`).join("")}</ul></section>`).join("")
      : CHAPTERS.filter(c => c.s === f).map(c => `<section class="card">${chapterNotes(c)}</section>`).join(""));
}
let practiceKeys = null, redoKeys = null;
function pagePractice() {
  const sel = store.get("psel", "企管全部");
  const opts = ["企管全部", "行銷全部", "企管＋行銷隨機 20 題", "英文文法全部", "邏輯思維全部", ...CHAPTERS.map(c => `${c.id}｜${c.s}｜${c.t}`)];
  if (!practiceKeys) {
    const all = Object.keys(QBANK);
    if (sel === "企管全部") practiceKeys = all.filter(k => k[0] === "M");
    else if (sel === "行銷全部") practiceKeys = all.filter(k => k[0] === "K");
    else if (sel.startsWith("企管＋行銷")) practiceKeys = shuffle(all.filter(k => /^[MK]/.test(k))).slice(0, 20);
    else if (sel === "英文文法全部") practiceKeys = all.filter(k => k[0] === "G");
    else if (sel === "邏輯思維全部") practiceKeys = all.filter(k => k[0] === "L");
    else { const id = sel.split("｜")[0]; practiceKeys = all.filter(k => k.startsWith(id + "-")); }
  }
  return `${practiceKeys && practiceKeys.redo ? "" : ""}<div class="toolbar"><select id="psel">${opts.map(o => `<option ${o === sel ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>
    <button class="btn sm" id="pre">重新出題</button></div>
    <p class="muted small">題庫共 ${Object.keys(QBANK).length} 題（企管 ${CHAPTERS.filter(c=>c.s==="企管").length * 4}、行銷 ${CHAPTERS.filter(c=>c.s==="行銷").length * 4}、英文 ${GRAMMAR.length * 4}、邏輯 ${LOGIC.length}）。答錯會自動進錯題本。</p>` + quizHTML(practiceKeys);
}
function pageEnglish() {
  const q = store.get("vq", "");
  const list = VOCAB.filter(([en, zh]) => !q || en.includes(q.toLowerCase()) || zh.includes(q));
  return `<section class="card"><h2>商業英文核心字（${VOCAB.length} 個）</h2>
    <input id="vsearch" placeholder="搜尋英文或中文" value="${esc(q)}">
    <table class="vt">${list.map(([en, zh]) => `<tr><td>${esc(en)}</td><td>${esc(zh)}</td></tr>`).join("")}</table></section>`;
}
function pageWrong() {
  const ks = Object.keys(wrong).filter(k => QBANK[k]).sort((a, b) => wrong[b] - wrong[a]);
  return `<p class="muted small">答錯的題目會留在這裡，重做答對就會移出。共 ${ks.length} 題。</p>` + quizHTML(ks, { empty: "目前沒有錯題 🎉" });
}
function pageProgress() {
  const study = SCHEDULE.filter(x => x.type !== "econ" && x.type !== "exam");
  const past = study.filter(x => x.d <= todayStr());
  const nd = study.filter(x => done[x.d]).length;
  const r = [0, 1, 2].map(v => ESSAYS.filter(e => rate[e.id] === v).length);
  return sec("📊 進度", `<div class="stats">
      <div><b>${nd}</b><span>已完成天數</span></div><div><b>${past.length}</b><span>至今應讀天數</span></div>
      <div><b>${r[2]}</b><span>申論熟了</span></div><div><b>${r[1]}</b><span>申論模糊</span></div><div><b>${r[0]}</b><span>申論忘了</span></div>
      <div><b>${Object.keys(wrong).length}</b><span>錯題</span></div></div>`) +
    sec("💾 備份與換裝置", `<p class="small">進度和練習紀錄只存在這台裝置的瀏覽器。換手機或電腦時，複製下面的備份碼，到另一台貼上並按「還原」。</p>
      <textarea id="bk" rows="4">${esc(JSON.stringify({ wrong, rate, done, log: Log.all() }))}</textarea>
      <div class="toolbar"><button class="btn sm" id="bkcopy">複製備份碼</button><button class="btn sm" id="bkload">還原貼上的備份碼</button><span id="bkmsg" class="small"></span></div>`) +
    sec("🗓️ 每週節奏", `<ul><li>週一～週四：申論 40 分＋章節或刷題 50 分＋英文 30 分</li><li>週五晚上：輕量 40 分，默寫本週申論＋錯題本＋單字</li><li>週六：經濟學日</li><li>週日晚上：輕量 40 分，回憶前幾週的申論＋單字＋邏輯 3 題</li></ul>
      <p class="small">申論 40 題在 1/27 前背完一輪；章節 1/11 讀完，之後換成刷題；2/22 開始衝刺，每天計時寫一題。</p>`);
}

// ===== 路由與渲染 =====
const PAGES = { today: ["今日任務", pageToday], essays: ["申論題庫", pageEssays], notes: ["重點整理", pageNotes], practice: ["題庫練習", pagePractice], english: ["英文單字", pageEnglish], wrong: ["錯題本", pageWrong], history: ["練習紀錄", () => `<div id="hist"></div>`], progress: ["進度", pageProgress] };
function route() { const h = location.hash.slice(1); return PAGES[h] ? h : "today"; }
function updateBadges() { const b = $("#wbadge"); if (b) b.textContent = Object.keys(wrong).length || ""; }
function render() {
  const r = route(), main = $("#main");
  $("#nav").innerHTML = Object.entries(PAGES).map(([k, [t]]) => `<a href="#${k}" class="${k === r ? "on" : ""}">${t}${k === "wrong" ? ` <span id="wbadge" class="badge"></span>` : ""}</a>`).join("");
  const days = Math.ceil((EXAM - new Date()) / 864e5);
  $("#count").textContent = days > 0 ? `距預估考試日 ${days} 天` : "考試加油！";
  main.innerHTML = PAGES[r][1]();
  bindQuiz(main); bindEssays(main); bindVocab(main); updateBadges();
  if ($("#hist")) renderHistory($("#hist"), { exam: "cht", onRedo: keys => { redoKeys = keys.filter(k => QBANK[k]); location.hash = "practice"; } });
  const on = (s, ev, f) => { const el = $(s); if (el) el[ev] = f; };
  on("#prev", "onclick", () => { const i = SCHEDULE.findIndex(x => x.d === curDate); curDate = SCHEDULE[i - 1].d; render(); scrollTo(0, 0); });
  on("#next", "onclick", () => { const i = SCHEDULE.findIndex(x => x.d === curDate); curDate = SCHEDULE[i + 1].d; render(); scrollTo(0, 0); });
  on("#dpick", "onchange", e => { if (SCHEDULE.find(x => x.d === e.target.value)) { curDate = e.target.value; render(); } });
  on("#donechk", "onchange", e => { if (e.target.checked) { done[curDate] = true; Log.add({ ex: "cht", ty: "d", d: curDate }); } else delete done[curDate]; saveAll(); });
  main.querySelectorAll("[data-ef]").forEach(b => b.onclick = () => { store.set("efilter", b.dataset.ef); render(); });
  on("#memo", "onchange", e => { store.set("ememo", e.target.checked); render(); });
  main.querySelectorAll("[data-nf]").forEach(b => b.onclick = () => { store.set("nfilter", b.dataset.nf); render(); });
  on("#psel", "onchange", e => { store.set("psel", e.target.value); practiceKeys = null; render(); });
  on("#pre", "onclick", () => { practiceKeys = null; render(); });
  on("#vsearch", "oninput", e => { store.set("vq", e.target.value); const p = e.target.selectionStart; render(); const v = $("#vsearch"); v.focus(); v.setSelectionRange(p, p); });
  on("#bkcopy", "onclick", async () => { try { await navigator.clipboard.writeText($("#bk").value); $("#bkmsg").textContent = "已複製"; } catch (e) { $("#bk").select(); $("#bkmsg").textContent = "請手動全選複製"; } });
  on("#bkload", "onclick", () => { try { const o = JSON.parse($("#bk").value); wrong = o.wrong || {}; rate = o.rate || {}; done = o.done || {}; if (o.log) Log.replace(o.log); saveAll(); $("#bkmsg").textContent = "已還原"; render(); } catch (e) { $("#bkmsg").textContent = "備份碼格式不對"; } });
  main.querySelectorAll("[data-jump]").forEach(a => a.onclick = ev => { ev.preventDefault(); store.set("efilter", "全部"); location.hash = "essays"; setTimeout(() => { const el = document.getElementById("e-" + a.dataset.jump); if (el) el.scrollIntoView({ block: "start" }); }, 50); });
}
addEventListener("hashchange", () => { practiceKeys = redoKeys; redoKeys = null; render(); scrollTo(0, 0); });
document.head.insertAdjacentHTML("beforeend", `<style>${HISTORY_CSS}</style>`);
if (typeof PORTAL_URL === "string" && PORTAL_URL) { const a = document.getElementById("portal"); if (a) { a.href = PORTAL_URL; a.hidden = false; } }
render();
</script></body></html>
